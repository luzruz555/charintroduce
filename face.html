<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼굴 위치 찍기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root { --bg: #ecebee; --ink: #3d3445; --soft: #857c8e; --pink: #ff5fae; --line: rgba(61,52,69,.12); color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 40px; display: flex; flex-direction: column; gap: 20px; }
h1 { font: 30px 'Jua', sans-serif; margin: 0; }
p { margin: 0; line-height: 1.7; color: var(--soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.card { background: #fff; border-radius: 18px; padding: 12px; box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h2 { font: 18px 'Jua', sans-serif; margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.card h2 small { font: 12px 'Gowun Dodum', sans-serif; color: var(--soft); }
.frame { position: relative; cursor: crosshair; border-radius: 12px; overflow: hidden; background: repeating-conic-gradient(#efedf2 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
.frame img { display: block; width: 100%; }
.mark { position: absolute; width: 26px; height: 26px; border: 3px solid var(--pink); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px #fff; pointer-events: none; }
.missing { padding: 40px 10px; text-align: center; font-size: 13px; color: var(--soft); }
.val { font: 13px ui-monospace, monospace; color: var(--soft); }
textarea { width: 100%; min-height: 220px; font: 14px ui-monospace, monospace; padding: 14px; border-radius: 14px; border: 0; box-shadow: 0 0 0 1px var(--line); color: var(--ink); background: #fff; }
button { font: 16px 'Jua', sans-serif; color: #fff; background: var(--ink); border: 0; border-radius: 99px; padding: 10px 22px; cursor: pointer; align-self: flex-start; }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>얼굴 위치 찍기</h1>
  <p>각 캐릭터 이미지에서 <b>얼굴 한가운데</b>를 한 번씩 눌러주세요. 다 찍으면 아래 코드를 복사해서 <b>index.html</b>의 <code>const FACE = { ... };</code> 부분에 통째로 덮어쓰면 돼요.</p>
  <div class="grid" id="grid"></div>
  <textarea id="out" readonly aria-label="복사할 코드"></textarea>
  <button id="copy" type="button">코드 복사하기</button>
</main>
<script>
const IMG_DIR = 'img/';
const LIST = [
  ['jiyul', '서지율'], ['prefect', '민수아'], ['soi', '유소이'], ['sia', '윤시아'],
  ['chaeyun', '민채윤'], ['huiyul', '서희율'], ['iru', '루아'],
];
const face = Object.fromEntries(LIST.map(([id]) => [id, [0.5, 0.17]]));
const grid = document.getElementById('grid');
const out = document.getElementById('out');

function writeOut() {
  const pad = Math.max(...LIST.map(([id]) => id.length)) + 1;
  out.value = 'const FACE = {\n' + LIST.map(([id]) =>
    `  ${(id + ':').padEnd(pad)} [${face[id][0].toFixed(2)}, ${face[id][1].toFixed(2)}],`).join('\n') + '\n};';
}

LIST.forEach(([id, name]) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${name}<small>${IMG_DIR}${id}.png</small></h2>
    <div class="frame"><img alt="${name}" src="${IMG_DIR}${id}.png"><span class="mark"></span></div>
    <div class="val"></div>`;
  grid.appendChild(card);
  const img = card.querySelector('img'), mark = card.querySelector('.mark'), val = card.querySelector('.val');
  const show = () => {
    mark.style.left = face[id][0] * 100 + '%'; mark.style.top = face[id][1] * 100 + '%';
    val.textContent = `[${face[id][0].toFixed(2)}, ${face[id][1].toFixed(2)}]`;
  };
  img.onerror = () => { card.querySelector('.frame').outerHTML = `<div class="missing">${IMG_DIR}${id}.png 파일이 없어요</div>`; };
  card.querySelector('.frame').addEventListener('click', e => {
    const r = img.getBoundingClientRect();
    face[id] = [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
    show(); writeOut();
  });
  show();
});
writeOut();

document.getElementById('copy').addEventListener('click', e => {
  navigator.clipboard.writeText(out.value)
    .then(() => { e.target.textContent = '복사했어요!'; })
    .catch(() => { out.select(); e.target.textContent = '선택됐어요. Ctrl+C로 복사하세요'; });
});
</script>
</body>
</html>
